<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuneFlow - Music</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">🎵 <span>TuneFlow</span></div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#songs">Songs</a>
            <a href="#">Playlist</a>
            <a href="#">Login</a>
        </div>
    </nav>


    <!-- HERO -->
    <section class="hero">
        <div class="hero-content">

            <p class="small-title">WELCOME TO TUNEFLOW</p>

            <h1>
                Your Music.<br>
                <span>Your Mood.</span>
            </h1>

            <p>
                Discover new music and enjoy your favourite songs
                anytime, anywhere.
            </p>

            <button onclick="scrollToSongs()">
                🎧 Explore Music
            </button>

        </div>
    </section>


    <!-- SONGS -->
    <section class="songs-section" id="songs">

        <div class="section-title">

            <div>
                <p>LISTEN NOW</p>
                <h2>🔥 Trending Songs</h2>
            </div>

            <div class="search-box">
                🔍
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search songs..."
                    onkeyup="searchSongs()"
                >
            </div>

        </div>

        <!-- 14 SONGS WILL APPEAR HERE -->
        <div class="song-list" id="songList"></div>

    </section>


    <!-- MUSIC PLAYER -->
    <div class="music-player">

        <div class="now-playing">

            <div class="mini-cover" id="miniCover">🎵</div>

            <div>
                <h4 id="currentSong">Select a song</h4>
                <p id="currentArtist">TuneFlow</p>
            </div>

        </div>


        <div class="player-controls">

            <button onclick="previousSong()">⏮</button>

            <button
                class="main-play"
                onclick="togglePlayer()">
                ▶
            </button>

            <button onclick="nextSong()">⏭</button>

        </div>


        <div class="volume">
            🔊
            <input
                type="range"
                min="0"
                max="100"
                value="80"
                id="volumeSlider">
        </div>

    </div>


    <audio id="audioPlayer"></audio>

    <script src="script.js"></script>

</body>
</html>
